<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Generator</title>
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 引入Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- 汉堡菜单按钮 - 用于控制侧边栏的显示/隐藏 -->
    <button class="hamburger-menu" aria-label="切换侧边栏" aria-expanded="false" aria-controls="sidebar">
        <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    
    <!-- 侧边栏导航 - 包含项目列表和创建项目按钮 -->
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="项目导航">
        <div class="sidebar-inner">
            <!-- 侧边栏头部 -->
            <div class="sidebar-header">
                <h2>项目列表</h2>
            </div>
            <!-- 项目列表容器 -->
            <ul class="project-list" id="project-list" role="list" aria-label="项目列表">
                <!-- 项目列表将通过JavaScript动态加载 -->
            </ul>
            <!-- 侧边栏底部 - 创建项目按钮 -->
            <div class="sidebar-footer">
                <button id="create-project-button" class="btn create-project-btn" aria-label="创建新项目">
                    <i class="fas fa-plus" aria-hidden="true"></i>
                    <span>新建项目</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main class="container" id="main-content">
        <div class="main-content">
            <!-- 左侧面板：提示词生成区域 -->
            <section class="left-panel" aria-label="提示词生成">
                <!-- 提示词生成表单 -->
                <div id="prompt-form-section">
                    <h2>生成提示词</h2>
                    <form id="prompt-form" style="display: none;">
                        <div class="form-group">
                            <label for="task">任务描述:</label>
                            <textarea id="task" name="task" required aria-required="true"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="variables">变量 (用逗号分隔):</label>
                            <input type="text" id="variables" name="variables" aria-describedby="variables-desc">
                            <small id="variables-desc" class="form-text">多个变量请用英文逗号分隔</small>
                        </div>
                        <button type="submit" class="btn">生成提示词</button>
                    </form>
                </div>

                <!-- 提示词版本历史列表 -->
                <div class="version-section">
                    <h3>版本历史</h3>
                    <div id="prompt-version-list" role="list" aria-label="提示词版本列表"></div>
                </div>

                <!-- 生成结果显示区域 -->
                <div id="result-container" aria-live="polite"></div>
            </section>

            <!-- 右侧面板：提示词测试区域 -->
            <section class="right-panel" aria-label="提示词测试">
                <h2>测试提示词</h2>
                <!-- 测试说明信息 -->
                <div class="test-info" id="test-info">
                    <p>请在左侧选择项目和提示词版本进行测试</p>
                </div>
                <!-- 测试表单 -->
                <form id="test-form" style="display: none;">
                    <div id="variable-inputs" class="variable-inputs"></div>
                    <button type="submit" class="btn">运行测试</button>
                </form>
                <!-- 测试结果显示区域 -->
                <div id="test-result" aria-live="polite"></div>
            </section>
        </div>
    </main>
    
    <!-- 引入JavaScript文件 -->
    <script src="/static/js/main.js"></script>
</body>
</html>
