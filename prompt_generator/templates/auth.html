<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示词工坊 - 登录或注册</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon/favicon-16x16.png">
    <link rel="shortcut icon" href="/static/img/favicon/favicon.ico">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/vendor/remixicon/remixicon.css">
    <style>
        :root {
            --bg-main: #F9F8F6;
            --bg-surface: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #4A4A4A;
            --text-dim: #8E8E8E;
            --accent-primary: #D97757;
            --accent-hover: #C66547;
            --border-subtle: #EBE9E1;
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --brand-font: "Young Serif", serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-secondary);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background-color: var(--bg-surface);
            border-radius: 24px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-lg);
            padding: 48px;
            width: 440px;
            max-width: 100%;
        }

        .auth-card h1 {
            color: var(--text-primary);
            margin-bottom: 8px;
            text-align: center;
            font-family: var(--brand-font);
            font-size: 2.25rem;
            letter-spacing: -0.02em;
        }

        .auth-card .subtitle {
            color: var(--text-dim);
            margin-bottom: 40px;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: 0.01em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border-subtle);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            background-color: #fafafa;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-primary);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(217, 119, 87, 0.08);
        }

        .form-group input::placeholder {
            color: var(--text-dim);
            opacity: 0.5;
        }

        .auth-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: var(--accent-primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            margin-top: 32px;
            box-shadow: 0 2px 4px rgba(217, 119, 87, 0.1);
        }

        .auth-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(217, 119, 87, 0.2);
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: var(--accent-primary);
        }

        .error-message {
            color: #ef4444;
            background-color: #fef2f2;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            color: #059669;
            background-color: #ecfdf5;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            display: none;
        }

        /* Step indicator */
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
        }

        .step {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--border-subtle);
            transition: all 0.3s;
        }

        .step.active {
            background-color: var(--accent-primary);
            width: 24px;
            border-radius: 4px;
        }

        /* Hidden class for transitions */
        .hidden {
            display: none !important;
        }

        /* Slide animation */
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* User badge for returning user */
        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background-color: var(--bg-main);
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .user-badge .avatar {
            width: 40px;
            height: 40px;
            background-color: var(--accent-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .user-badge .email {
            flex: 1;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .user-badge .change-email {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }

        .user-badge .change-email:hover {
            color: var(--accent-primary);
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>提示词工坊</h1>
            <p class="subtitle" id="subtitle">高效创建、管理和优化AI提示词</p>

            <!-- Step Indicator -->
            <div class="step-indicator">
                <div class="step active" id="step1"></div>
                <div class="step" id="step2"></div>
            </div>

            <!-- Error/Success Messages -->
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>

            <!-- Step 1: Email Input -->
            <div id="email-step">
                <form id="email-form">
                    <div class="form-group">
                        <label for="email">电子邮箱</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required autofocus>
                    </div>

                    <button type="submit" class="auth-button" id="continue-btn">
                        <span>继续</span>
                        <i class="ri-arrow-right-line"></i>
                    </button>
                </form>
            </div>

            <!-- Step 2: Login (for existing users) -->
            <div id="login-step" class="hidden">
                <div class="user-badge">
                    <div class="avatar" id="user-avatar">T</div>
                    <div class="email" id="user-email">test@example.com</div>
                    <a href="#" class="change-email" id="change-email-btn">更换邮箱</a>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" name="password" placeholder="输入密码" required>
                    </div>

                    <button type="submit" class="auth-button" id="login-btn">
                        <span>登录</span>
                    </button>
                </form>

                <div class="back-link">
                    <a href="#" id="forgot-password-link">
                        <i class="ri-question-line"></i>
                        忘记密码？
                    </a>
                </div>
            </div>

            <!-- Step 2: Register (for new users) -->
            <div id="register-step" class="hidden">
                <div class="user-badge">
                    <div class="avatar" id="new-user-avatar">N</div>
                    <div class="email" id="new-user-email">new@example.com</div>
                    <a href="#" class="change-email" id="change-email-btn-register">更换邮箱</a>
                </div>

                <form id="register-form">
                    <div class="form-group">
                        <label for="username">用户名（可选）</label>
                        <input type="text" id="username" name="username" placeholder="给自己起个名字">
                    </div>

                    <div class="form-group">
                        <label for="register-password">设置密码</label>
                        <input type="password" id="register-password" name="password" placeholder="至少6位字符" required
                            minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">确认密码</label>
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="再次输入密码"
                            required>
                    </div>

                    <button type="submit" class="auth-button" id="register-btn">
                        <span>创建账号</span>
                    </button>
                </form>
            </div>

            <!-- Back to home link -->
            <div class="back-link" id="home-link">
                <a href="/landing">
                    <i class="ri-arrow-left-line"></i>
                    返回首页
                </a>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentEmail = '';
        let isExistingUser = false;

        // DOM Elements
        const emailStep = document.getElementById('email-step');
        const loginStep = document.getElementById('login-step');
        const registerStep = document.getElementById('register-step');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const subtitle = document.getElementById('subtitle');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');

        // Email form submission
        document.getElementById('email-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('email').value.trim();
            if (!email) return;

            currentEmail = email;
            const btn = document.getElementById('continue-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';

            try {
                // Check if email exists
                const response = await fetch('/auth/check-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                if (response.ok) {
                    isExistingUser = result.exists;
                    showStep2(email, isExistingUser);
                } else {
                    showError(result.detail || '检查邮箱时出错');
                }
            } catch (error) {
                console.error('Check email error:', error);
                showError('网络错误，请稍后重试');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>继续</span><i class="ri-arrow-right-line"></i>';
            }
        });

        // Login form submission
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideMessages();

            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Login successful, redirect to home
                    window.location.href = '/';
                } else {
                    showError(result.detail || '登录失败，请检查密码');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('网络错误，请稍后重试');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>登录</span>';
            }
        });

        // Register form submission
        document.getElementById('register-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideMessages();

            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const username = document.getElementById('username').value.trim();

            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }

            if (password.length < 6) {
                showError('密码至少需要6位字符');
                return;
            }

            const btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';

            try {
                // Use form submission for register
                const formData = new URLSearchParams();
                formData.append('email', currentEmail);
                formData.append('password', password);
                if (username) formData.append('username', username);

                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                // Register endpoint returns HTML redirect, so we follow it
                if (response.redirected) {
                    window.location.href = response.url;
                } else if (response.ok) {
                    // If it returns HTML, we need to redirect manually
                    window.location.href = `/auth/verify-email-page?email=${encodeURIComponent(currentEmail)}`;
                } else {
                    const text = await response.text();
                    // Try to parse as JSON
                    try {
                        const result = JSON.parse(text);
                        showError(result.detail || '注册失败');
                    } catch {
                        showError('注册失败，请稍后重试');
                    }
                }
            } catch (error) {
                console.error('Register error:', error);
                showError('网络错误，请稍后重试');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>创建账号</span>';
            }
        });

        // Change email buttons
        document.getElementById('change-email-btn').addEventListener('click', function (e) {
            e.preventDefault();
            showStep1();
        });
        document.getElementById('change-email-btn-register').addEventListener('click', function (e) {
            e.preventDefault();
            showStep1();
        });

        // Forgot password
        document.getElementById('forgot-password-link').addEventListener('click', async function (e) {
            e.preventDefault();
            hideMessages();

            if (!confirm(`将向 ${currentEmail} 发送密码重置邮件，确认继续？`)) {
                return;
            }

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `email=${encodeURIComponent(currentEmail)}`
                });

                if (response.ok) {
                    showSuccess('密码重置邮件已发送，请查收邮箱');
                } else {
                    const result = await response.json();
                    showError(result.detail || '发送失败');
                }
            } catch (error) {
                showError('发送失败，请稍后重试');
            }
        });

        // Helper functions
        function showStep2(email, isExisting) {
            emailStep.classList.add('hidden');
            step1.classList.remove('active');
            step2.classList.add('active');

            const initial = email.charAt(0).toUpperCase();

            if (isExisting) {
                // Show login form
                document.getElementById('user-avatar').textContent = initial;
                document.getElementById('user-email').textContent = email;
                loginStep.classList.remove('hidden');
                loginStep.classList.add('slide-in');
                subtitle.textContent = '欢迎回来';
                document.getElementById('login-password').focus();
            } else {
                // Show register form
                document.getElementById('new-user-avatar').textContent = initial;
                document.getElementById('new-user-email').textContent = email;
                registerStep.classList.remove('hidden');
                registerStep.classList.add('slide-in');
                subtitle.textContent = '创建您的账号';
                document.getElementById('username').focus();
            }
        }

        function showStep1() {
            loginStep.classList.add('hidden');
            registerStep.classList.add('hidden');
            emailStep.classList.remove('hidden');
            step1.classList.add('active');
            step2.classList.remove('active');
            subtitle.textContent = '高效创建、管理和优化AI提示词';
            document.getElementById('email').focus();
            hideMessages();
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }
    </script>
</body>

</html>
